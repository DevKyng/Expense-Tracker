
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expense Tracker</title>
  <link rel="stylesheet" href="Expense.css">
  <script src="expense.js  " defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">PERSONAL FINANCE</p>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Keep track of where your money goes.</p>
    </header>

    <section class="summary" aria-label="Spending summary">
      <p>Total expenses</p>
      <h2 id="total-expenses">₦0.00</h2>
      <p id="expense-count">0 transactions recorded</p>
    </section>

    <section class="entry-section">
      <h2>Add an expense</h2>

      <form id="expense-form">
        <div class="field">
          <label for="description">What did you spend on?</label>
          <input
            type="text"
            id="description"
            placeholder="e.g. Lunch, transport"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="amount">Amount (₦)</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g. 2500"
            min="0.01"
            step="0.01"
            required
          >
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Education">Education</option>
            <option value="Data & Airtime">Data & Airtime</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="transactions-section">
      <div class="section-heading">
        <h2>Recent expenses</h2>
        <span id="list-count">0 items</span>
      </div>

      <p id="empty-state">No expenses yet. Add your first expense above.</p>
      <ul id="expense-list" aria-label="Expense list"></ul>
    </section>

    <footer>
      Your expenses are saved on this device.
    </footer>
  </main>
</body>
</html>
